<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#f5f7fb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:90%;max-width:350px;text-align:center}
h2{color:#1a5490;margin-bottom:20px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:15px;}
button{width:100%;padding:12px;background:#28a745;color:#fff;border:none;border-radius:5px;font-size:16px;cursor:pointer;font-weight:bold;margin-top:10px;}
button:hover{background:#218838}
.flash{color:red;font-size:13px;margin-bottom:10px;}
</style></head><body>
<div class="card">
    <h2>Change Password</h2>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <form method="POST" autocomplete="off">
        <input type="password" name="old_password" placeholder="Purana Password (ya Phone Number)" required>
        <input type="password" name="new_password" placeholder="Naya Password" required>
        <button type="submit">Change Karein</button>
    </form>
    <p style="margin-top:20px;font-size:13px;"><a href="/member_dashboard" style="color:#1a5490;">Wapas Dashboard Par Jayein</a></p>
</div></body></html>
