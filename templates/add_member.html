{% extends 'base.html' %}
{% block content %}
<div class="card">
<h2>Naya Member Add Karein (Admin)</h2>
<form method="POST">
<label>Naam *</label><input type="text" name="name" required>
<label>Mobile Number *</label><input type="text" name="phone" placeholder="03XXXXXXXXX" required>
<label>Member Ka Password *</label><input type="password" name="password" required placeholder="Member ko yeh password dein">
<label>CNIC</label><input type="text" name="cnic" placeholder="XXXXX-XXXXXXX-X">
<label>Address</label><input type="text" name="address">
<label>Address Type</label>
<select name="address_type"><option value="own">Apna Ghar (Malik)</option><option value="rent">Kiraye Par</option><option value="family">Family ke sath</option></select>
<div class="row">
<div class="col-half"><label>Guarantor Naam</label><input type="text" name="guarantor_name"></div>
<div class="col-half"><label>Guarantor Phone</label><input type="text" name="guarantor_phone"></div>
</div>
<label><input type="checkbox" name="verified" value="1" style="width:auto;margin-right:8px;"> Verified</label><br>
<button type="submit" class="btn btn-primary">Save Karein</button>
<a href="{{ url_for('members') }}" class="btn btn-secondary">Cancel</a>
</form></div>
{% endblock %}
