<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naya Account Banayein</title>
<link rel="manifest" href="/static/manifest.json"><meta name="theme-color" content="#28a745">
<style>
body{font-family:'Segoe UI',sans-serif;background:#f5f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.card{background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:100%;max-width:400px;}
h2{color:#1a5490;margin-bottom:20px;text-align:center}
label{display:block;margin-top:10px;font-weight:bold;font-size:14px;color:#333}
input, select {width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:15px;}
button{width:100%;padding:12px;background:#28a745;color:#fff;border:none;border-radius:5px;font-size:16px;cursor:pointer;font-weight:bold;margin-top:20px;}
button:hover{background:#218838}
.flash{color:red;font-size:13px;text-align:center;margin-bottom:10px;}
.file-input {background:#f8f9fa; padding:10px; border:1px dashed #ccc; text-align:center; cursor:pointer; font-size:13px;}
</style></head><body>
<div class="card">
    <h2>Join Committee</h2>
    <p style="text-align:center;font-size:13px;color:#666;margin-bottom:15px;">Apni details bharein taake Admin aap ko approve kare.</p>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <form method="POST" enctype="multipart/form-data">
        <label>Pura Naam *</label><input type="text" name="name" required>
        <label>Mobile Number *</label><input type="text" name="phone" placeholder="03XXXXXXXXX" required>
        <label>Password (Naya Banayein) *</label><input type="password" name="password" required placeholder="Apna Password likhein">
        <label>CNIC Number</label><input type="text" name="cnic" placeholder="XXXXX-XXXXXXX-X">
        <label>Address (Optional)</label><input type="text" name="address">
        <label>Shobha / Profession (Optional)</label><input type="text" name="profession" placeholder="e.g. Teacher, Business, Job">
        <label>Mahana Aamdani / Monthly Income (Optional)</label><input type="text" name="monthly_income" placeholder="e.g. 50,000">
        <label>Kis Ne Recommend Kya? (Optional)</label><input type="text" name="referred_by" placeholder="Friend/Family member ka naam">
        <label style="margin-top:15px;">Mahana Qist (Monthly Amount) *</label>
        <select name="preferred_amount" required>
            <option value="5000">Rs. 5,000</option>
            <option value="10000">Rs. 10,000</option>
            <option value="20000">Rs. 20,000</option>
            <option value="50000">Rs. 50,000</option>
        </select>
        <label style="margin-top:15px; color:#1a5490;">CNIC Front Picture</label>
        <input type="file" name="cnic_front" accept="image/*" capture="environment" class="file-input">
        <label style="color:#1a5490;">CNIC Back Picture</label>
        <input type="file" name="cnic_back" accept="image/*" capture="environment" class="file-input">
        <label style="color:#1a5490;">Aap Ki Selfie (Live Camera)</label>
        <input type="file" name="selfie" accept="image/*" capture="user" class="file-input">
        <button type="submit">Request Bhejein</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:13px;"><a href="/member_login" style="color:#1a5490;">Pehle se account hai? Login karein</a></p>
</div></body></html>
